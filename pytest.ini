[pytest]
testpaths = tests
# La radice del repo nel path: i moduli si importano come
# custom_components.baxi_hybridapp_home.* (come fa Home Assistant).
pythonpath = .
addopts = -ra
# Avvisi di deprecazione emessi da librerie di terze parti (stack cloud di HA)
# all'import: non riguardano l'integrazione.
filterwarnings =
    ignore::DeprecationWarning:josepy.*
    ignore::DeprecationWarning:acme.*
    ignore::DeprecationWarning:homeassistant.components.http.*
